<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Umail - Richiedilo Ora</title>
    <style>
        /* Reset e Stili Base (Stile Apple) */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Abilita lo scroll fluido nativo */
        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #1d1d1f;
            overflow-x: hidden;
            width: 100%;
        }

        /* Contenitore Globale */
        .page-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Barra di Navigazione Minimal */
        .navbar {
            width: 100%;
            height: 48px;
            background-color: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
            position: fixed;
            top: 0;
            left: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            z-index: 100;
        }

        .brand {
            font-weight: 600;
            font-size: 14px;
            letter-spacing: -0.01em;
        }

        .badge {
            font-size: 12px;
            background-color: #f5f5f7;
            padding: 4px 10px;
            border-radius: 12px;
            color: #86868b;
            font-weight: 500;
        }

        /* Contenitore Principale (Hero Section) */
        .hero {
            margin-top: 120px;
            text-align: center;
            max-width: 800px;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .title {
            font-size: 56px;
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.07;
            margin-bottom: 16px;
        }

        .subtitle {
            font-size: 24px;
            font-weight: 400;
            color: #86868b;
            letter-spacing: -0.015em;
            line-height: 1.3;
            max-width: 600px;
            margin-bottom: 32px;
        }

        /* Pulsante di Scroll */
        .scroll-btn {
            background-color: #0071e3;
            color: #ffffff;
            font-size: 17px;
            font-weight: 400;
            padding: 12px 22px;
            border-radius: 980px;
            text-decoration: none;
            display: inline-block;
            transition: background-color 0.2s ease;
            margin-bottom: 64px;
            cursor: pointer;
        }

        .scroll-btn:hover {
            background-color: #0077ed;
        }

        /* Contenitore Immagine GUI con effetto Mac */
        .gui-container {
            width: 100%;
            max-width: 900px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08), 
                        0 1px 3px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(0, 0, 0, 0.1);
            overflow: hidden;
            margin-bottom: 80px;
            animation: fadeInUp 1s ease-out;
        }

        .window-header {
            height: 28px;
            background-color: #f5f5f7;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            display: flex;
            align-items: center;
            padding-left: 16px;
            gap: 8px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .dot.red { background-color: #ff5f56; }
        .dot.yellow { background-color: #ffbd2e; }
        .dot.green { background-color: #27c93f; }

        .gui-image {
            width: 100%;
            height: auto;
            display: block;
        }

        /* SEZIONE BLU SCURO PER IL FORM */
        .dark-section {
            width: 100vw;
            background-color: #001d3d;
            padding: 90px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .dark-section h2 {
            color: #ffffff;
            font-size: 32px;
            font-weight: 600;
            letter-spacing: -0.01em;
            margin-bottom: 12px;
        }

        .dark-section p {
            color: #b0c4de;
            font-size: 17px;
            max-width: 500px;
            margin-bottom: 36px;
            line-height: 1.4;
        }

        /* Form con codifica URL esplicita e corretta */
        .elegant-form {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            width: 100%;
        }

        .form-group label {
            color: #f5f5f7;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
            letter-spacing: 0.02em;
        }

        .elegant-input, .elegant-textarea {
            width: 100%;
            padding: 14px 16px;
            font-size: 16px;
            background-color: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            color: #ffffff;
            outline: none;
            transition: border-color 0.2s, background-color 0.2s;
        }

        .elegant-textarea {
            resize: vertical;
            min-height: 100px;
            font-family: inherit;
        }

        .elegant-input::placeholder, .elegant-textarea::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .elegant-input:focus, .elegant-textarea:focus {
            border-color: #0071e3;
            background-color: rgba(255, 255, 255, 0.12);
        }

        /* Pulsante di Invio */
        .submit-btn {
            width: 100%;
            background-color: #0071e3;
            color: #ffffff;
            font-size: 16px;
            font-weight: 500;
            padding: 14px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            margin-top: 8px;
            transition: background-color 0.2s;
        }

        .submit-btn:hover {
            background-color: #0077ed;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .title { font-size: 40px; }
            .subtitle { font-size: 20px; }
            .hero { margin-top: 90px; }
            .dark-section h2 { font-size: 26px; }
        }
    </style>
</head>
<body>

    <div class="page-wrapper">

        <!-- Barra di Navigazione -->
        <nav class="navbar">
            <div class="brand">Umail</div>
            <div class="badge">In Arrivo</div>
        </nav>

        <!-- Sezione Principale -->
        <main class="hero">
            <h1 class="title">La tua prossima app.<br>Semplice. Potente.</h1>
            <p class="subtitle">Scandaglia fiumi di file in secondi. Le tue mail sono qui, pronte ed ordinate.</p>
            
            <a href="#iscrizione" class="scroll-btn">Richiedilo ora</a>

            <!-- Finestra Mockup -->
            <div class="gui-container">
                <div class="window-header">
                    <div class="dot red"></div>
                    <div class="dot yellow"></div>
                    <div class="dot green"></div>
                </div>
                <img src="Emailextractor.png" alt="Anteprima dell'interfaccia" class="gui-image">
            </div>
        </main>

        <!-- SEZIONE BLU SCURO CORRETTA PER FORMSPREE -->
        <section id="iscrizione" class="dark-section">
            <h2>Richiedi l'accesso in anteprima</h2>
            <p>Inserisci i tuoi dati qui sotto. Sarai tra i primi a provare la potenza di Umail.</p>

            <!-- L'aggiunta di enctype forza la trasmissione corretta dei dati escludendo i blocchi del browser -->
            <form action="https://formspree.io/f/mrpgnoep" method="POST" enctype="application/x-www-form-urlencoded" class="elegant-form">
                
                <div class="form-group">
                    <label for="email">Your email:</label>
                    <input type="email" id="email" name="email" class="elegant-input" placeholder="mario@esempio.com" required>
                </div>
                
                <div class="form-group">
                    <label for="message">Your message:</label>
                    <textarea id="message" name="message" class="elegant-textarea" placeholder="Scrivi qui il tuo messaggio..." required></textarea>
                </div>

                <button type="submit" class="submit-btn">Send</button>
            </form>
        </section>

    </div>

</body>
</html>
