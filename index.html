<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Il Mio Prodotto Digitale</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f7f6; color: #333; text-align: center; padding: 50px 20px; }
        .card { background: white; max-width: 450px; margin: 0 auto; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { margin-bottom: 10px; color: #111; }
        .price { font-size: 24px; font-weight: bold; color: #2ecc71; margin: 20px 0; }
        .btn { display: inline-block; background-color: #0070ba; color: white; padding: 14px 30px; text-decoration: none; font-weight: bold; border-radius: 30px; transition: background 0.2s; margin-top: 10px; }
        .btn:hover { background-color: #005ea6; }
        .btn-stripe { background-color: #635bff; }
        .btn-stripe:hover { background-color: #4b45ce; }
    </style>
</head>
<body>

    <div class="card">
        <!-- Puoi cambiare il titolo e la descrizione qui sotto -->
        <h1>Il Mio Prodotto</h1>
        <p>Inserisci qui la descrizione accattivante del tuo file, ebook, corso o servizio digitale.</p>
        
        <div class="price">€19,99</div>

        <!-- SOSTITUISCI I LINK QUI SOTTO CON I TUOI GENERATI AL PASSO 1 -->
        <a href="INSERISCI_QUI_IL_TUO_LINK_PAYPAL" class="btn" target="_blank">Paga con PayPal</a>
        
        <!-- Se usi anche Stripe, scommenta o usa questo pulsante:
        <a href="INSERISCI_QUI_IL_TUO_LINK_STRIPE" class="btn btn-stripe" target="_blank">Paga con Carta (Stripe)</a> 
        -->
    </div>

</body>
</html>
